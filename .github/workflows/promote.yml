name: Promote to production

# main is where fixes land; production is what Railway and Vercel deploy.
# This advances production to the exact commit the Tests workflow just
# proved green — so a fix can be pushed to main the moment its own suites
# pass, while the full 115-suite gate still stands between every push and
# the subscribers. It just runs here, in parallel with the next fix being
# written, instead of holding a terminal hostage for twelve minutes.
#
# A red Tests run simply means production does not move. Nothing to clean
# up, nothing deployed, and the failure output says what to fix.
#
# Takes effect only once Railway (service → Settings → Source) and Vercel
# (project → Settings → Git → Production Branch) are switched from main to
# production. Until then this fast-forwards a branch nothing deploys.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
  # A manual promote for the rare push Tests doesn't cover (workflow-only
  # changes, say) — promotes whatever main currently is.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Tests green is necessary but not sufficient: the Sheet-layout
      # workflow gates the drawing engine separately and runs on the same
      # push whenever the frontend changed. A backend-only push has no
      # sheet run for its SHA — that's a pass, not a gap.
      - name: Require Sheet-layout tests green for this commit too
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          for i in $(seq 1 20); do
            RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sheet-tests.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "absent" else "\(.status)/\(.conclusion)" end')
            echo "Sheet-layout run for $SHA: $RUN (check $i)"
            case "$RUN" in
              absent|completed/success) exit 0 ;;
              completed/*) echo "Sheet-layout tests did not pass — not promoting."; exit 1 ;;
              *) sleep 30 ;;   # still queued or running — it's a two-minute job, wait it out
            esac
          done
          echo "Sheet-layout tests still not finished after 10 minutes — not promoting."
          exit 1
      - name: Fast-forward production to the tested commit
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "Promoting $SHA to production"
          # A plain push is fast-forward-or-fail: if a newer commit was
          # already promoted while this one's tests ran, this fails
          # harmlessly and the newer promotion stands.
          git push origin "$SHA:refs/heads/production" && echo "production is now $SHA" \
            || echo "production is already ahead of $SHA — nothing to do"
      # Pushing the branch is meant to be enough — Vercel watches
      # `production` and builds it. In practice it has repeatedly skipped
      # the build (the same SHA was already built from main, so it treats
      # the branch push as nothing new) and the site sat on stale code
      # until somebody clicked Promote to Production by hand. This asks
      # Vercel for the build explicitly, which it will not deduplicate.
      #
      # Setup, once: Vercel project → Settings → Git → Deploy Hooks →
      # create one on branch `production`, copy the URL, then paste it into
      # GitHub → repo Settings → Secrets and variables → Actions → new
      # secret named VERCEL_DEPLOY_HOOK. Until that exists this step warns
      # and passes: a missing hook must never turn a green promote red.
      - name: Ask Vercel to build production
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning title=No Vercel deploy hook::production was pushed but no build was requested. The site may stay on the previous version until someone clicks Promote to Production in Vercel. To fix permanently: Vercel project -> Settings -> Git -> Deploy Hooks -> create one on branch 'production', then save the URL as the GitHub secret VERCEL_DEPLOY_HOOK."
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/hook.out -w '%{http_code}' -X POST "$HOOK" || echo 000)
          echo "Vercel replied $CODE"
          cat /tmp/hook.out || true
          echo
          case "$CODE" in
            2*) echo "Vercel accepted the build request — the site will update when it finishes." ;;
            *)  echo "::error title=Vercel did not accept the deploy hook::HTTP $CODE. production is promoted but the site is not rebuilding. Check the hook still exists in Vercel and that VERCEL_DEPLOY_HOOK is current."
                exit 1 ;;
          esac

      # Accepting a build request is not the same as serving it. Three times
      # now the branch has been promoted, the hook has answered 201, and
      # roofmap.co.nz has gone on serving the previous commit — the hook
      # build and the branch-push build race, and one of them is cancelled.
      # Nobody noticed until a person went looking for a change that was not
      # there.
      #
      # So: fetch the app the public actually gets and compare it, byte for
      # byte, with the file at the promoted commit. Equal means deployed.
      # Anything else fails this workflow loudly, with the one click that
      # fixes it — a red promote is cheap; a silently stale site is not.
      - name: Verify the site is really serving this commit
        env:
          APP_URL: ${{ vars.APP_URL || 'https://roofmap.co.nz/app' }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          WANT=$(git show "$SHA:floodroofing/frontend/app.html" | sha256sum | cut -d' ' -f1)
          echo "Waiting for $APP_URL to serve app.html from $SHA (sha256 ${WANT:0:12}…)"
          for i in $(seq 1 24); do
            GOT=$(curl -fsSL --max-time 30 "$APP_URL" 2>/dev/null | sha256sum | cut -d' ' -f1)
            if [ "$GOT" = "$WANT" ]; then
              echo "Live after $((i*20))s — the site is serving this commit."
              exit 0
            fi
            echo "  check $i: serving ${GOT:0:12}…, want ${WANT:0:12}…"
            sleep 20
          done
          echo "::error title=The site is NOT serving this commit::production was promoted to $SHA and Vercel accepted a build, but after 8 minutes $APP_URL is still serving different code. Vercel most likely cancelled the build (the deploy hook and the branch push race each other). FIX: open the Vercel project -> Deployments -> newest -> Promote to Production. Then tell whoever shipped this, because the change they think is live is not."
          exit 1
