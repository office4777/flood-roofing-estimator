<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoofMap Crew</title>
<meta name="description" content="The crew's day: jobs from the schedule, the job on site, checklists, photos and hours.">
<meta name="theme-color" content="#0a1628">
<meta name="robots" content="noindex">
<link rel="manifest" href="crew.webmanifest">
<link rel="icon" href="brand/pwa-192.png">
<link rel="apple-touch-icon" href="brand/pwa-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RoofMap Crew">
<style>
:root{--navy:#0a1628;--blue:#0099e0;--blue-d:#0077b3;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;
  --green:#16a34a;--red:#dc2626;--amber:#d97706;--chip:#e0f2fe}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e2e8f0;--mut:#94a3b8;--line:#1e293b;--bg:#020817;--card:#0f172a;--chip:#0c2a3f}}
:root[data-theme="dark"]{--ink:#e2e8f0;--mut:#94a3b8;--line:#1e293b;--bg:#020817;--card:#0f172a;--chip:#0c2a3f}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
#top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
#top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .back{background:none;border:0;color:#fff;font-size:22px;padding:0 6px 0 0;cursor:pointer;display:none}
#sync{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap;cursor:pointer;border:0;color:#fff}
#sync.off{background:#7c2d12}#sync.wait{background:#92400e}
#main{padding:14px 14px calc(env(safe-area-inset-bottom) + 86px);max-width:720px;margin:0 auto}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#nav button b{font-size:20px;font-weight:400;line-height:1}
#nav button.on{color:var(--blue);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;font-weight:700}
.big{font-size:20px;font-weight:700;margin:0 0 2px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:13px 14px;font-weight:700;cursor:pointer;text-decoration:none;min-height:48px}
.btn.p{background:var(--blue);color:#fff}.btn.g{background:var(--green);color:#fff}.btn.r{background:var(--red);color:#fff}
.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.w{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.job{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:14px;padding:13px 14px;margin:0 0 10px;cursor:pointer;color:inherit}
.job .c{font-weight:700;font-size:17px}.job .a{color:var(--mut);font-size:14px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink);margin-right:4px}
.banner{border-radius:12px;padding:11px 13px;margin:0 0 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.ok{background:#dcfce7;color:#14532d}.banner.no{background:#e2e8f0;color:#334155}.banner.warn{background:#fef3c7;color:#78350f}.banner.info{background:#e0f2fe;color:#0c4a6e}
.status{font-weight:700}
.day{margin:0 0 14px}.day h3{font-size:14px;margin:0 0 8px;color:var(--mut);display:flex;justify-content:space-between}
.day.today h3{color:var(--blue)}
.empty{color:var(--mut);font-size:14px;padding:4px 2px 8px}
ul.lines{margin:0;padding-left:18px}ul.lines li{margin:3px 0}
.chk{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:24px;height:24px;flex:0 0 auto}
.chk.done span{color:var(--mut);text-decoration:line-through}
.file{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit}
.file:last-child{border-bottom:0}
.file .ic{font-size:22px;width:28px;text-align:center}
.file .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wait-chip{font-size:11px;background:#fef3c7;color:#78350f;padding:2px 7px;border-radius:999px}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input.t,select.t,textarea.t{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px}
textarea.t{min-height:80px;resize:vertical}
table.h{width:100%;border-collapse:collapse;font-size:14px}
table.h td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.h td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tot{font-weight:700}
.wk{display:flex;align-items:center;gap:8px;margin:0 0 12px}.wk .lbl{flex:1;text-align:center;font-weight:700}
.wk button{min-width:48px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;padding:10px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--blue);color:#fff}
.near{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 74px);z-index:30;background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none}
.near.on{display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 80px);z-index:40;background:#0f172a;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.signin{max-width:420px;margin:8vh auto 0}
.signin .logo{text-align:center;margin:0 0 18px}
.signin .logo img{width:72px;height:72px;border-radius:16px}
.err{color:var(--red);font-size:14px;margin:8px 0 0;min-height:1em}
.pre{white-space:pre-wrap}
.photo-in{display:none}
</style>
</head>
<body>
<header id="top"><button class="back" id="backBtn" aria-label="Back" onclick="history.back()">‹</button><h1 id="title">RoofMap Crew</h1><button id="sync" onclick="syncNow(true)">…</button></header>
<main id="main"></main>
<nav id="nav" hidden>
  <button data-v="today" onclick="go('#/today')"><b>☀</b>Today</button>
  <button data-v="week" onclick="go('#/week')"><b>▦</b>Week</button>
  <button data-v="hours" onclick="go('#/hours')"><b>⏱</b>Hours</button>
  <button data-v="me" onclick="go('#/me')"><b>☺</b>Me</button>
</nav>
<div class="near" id="near"></div>
<div id="toast"></div>
<input type="file" id="camIn" class="photo-in" accept="image/*,video/*" capture="environment">
<input type="file" id="pickIn" class="photo-in" accept="image/*,video/*" multiple>
<script>
'use strict';
// THE CREW APP (2026-11-13). The phone is the truth while there is no signal:
// every press is kept on the phone at once and sent when it can be. Location
// is only asked for, and only kept, 7 am – 7 pm on a day the crew is booked
// on the schedule board (the server refuses it outside that whatever is sent).
var CREW_BUILD = '2026-11-13a';
var API = window.CREW_API || 'https://flood-roofing-estimator-production.up.railway.app';
var NZ = 'Pacific/Auckland';
var GPS_FROM = 7, GPS_TO = 19, SITE_R = 200, KEEP_EVERY_MS = 60000, KEEP_MOVE_M = 40;

var LS = {
  get: function(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del: function(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
var S = {
  token: (function(){ try { return localStorage.getItem('crew_token') || ''; } catch (e) { return ''; } })(),
  me: LS.get('crew_me', null),
  online: navigator.onLine !== false,
  q: LS.get('crew_q', { events: [], points: [] }),
  status: LS.get('crew_status', null),       // {kind, row_id, at, date}
  week: LS.get('crew_week', null),
  weekFrom: null, weekAll: false,
  fix: null, watch: null, lastKept: null, fileWait: 0, syncing: false
};
function saveQ(){ LS.set('crew_q', S.q); paintSync(); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid(){ try { return crypto.randomUUID(); } catch (e) { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2); } }
function toast(t){ var el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ el.classList.remove('on'); }, 2600); }

// ── NZ time ──
function nzParts(d){
  var p = {}; new Intl.DateTimeFormat('en-NZ', { timeZone: NZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(d || new Date()).forEach(function(x){ p[x.type] = x.value; });
  return { date: p.year + '-' + p.month + '-' + p.day, hour: +p.hour, minute: +p.minute };
}
function nzToday(){ return nzParts(new Date()).date; }
function addDays(iso, n){ var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function mondayOf(iso){ var d = new Date(iso + 'T00:00:00Z'); return addDays(iso, -((d.getUTCDay() + 6) % 7)); }
function dayName(iso, long){ return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-NZ', { weekday: long ? 'long' : 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }); }
function hm(isoT){ return new Date(isoT).toLocaleTimeString('en-NZ', { hour: 'numeric', minute: '2-digit', timeZone: NZ }); }
function hrs(h){ h = +h || 0; var m = Math.round(h * 60); return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm'; }

// ── the server ──
async function api(method, path, body){
  var opts = { method: method, headers: { Authorization: 'Bearer ' + S.token } };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  var r;
  try { r = await fetch(API + path, opts); }
  catch (e) { setOnline(false); var ne = new Error('No signal — kept on your phone.'); ne.offline = true; throw ne; }
  setOnline(true);
  var j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status === 401) { signOut(true); var ae = new Error('Please sign in again.'); ae.status = 401; throw ae; }
  if (!r.ok) { var er = new Error(j.error || ('The server answered ' + r.status)); er.status = r.status; er.code = j.code; throw er; }
  return j;
}
function setOnline(v){ if (S.online !== v) { S.online = v; paintSync(); if (v) setTimeout(function(){ syncNow(); }, 50); } }

// ── what is waiting to send ──
function pending(){ return S.q.events.length + (S.q.points.length ? 1 : 0) + S.fileWait; }
function paintSync(){
  var el = document.getElementById('sync'); if (!el) return;
  var n = S.q.events.length + S.fileWait;
  el.className = !S.online ? 'off' : (n ? 'wait' : '');
  el.textContent = !S.online ? (n ? 'No signal · ' + n + ' waiting' : 'No signal') : (n ? n + ' to send…' : (S.syncing ? 'Sending…' : '✓ Up to date'));
}
async function syncNow(byHand){
  if (!S.token) return;
  if (S.syncing) { S.syncAgain = true; return; }
  S.syncing = true; paintSync();
  try {
    if (S.q.events.length || S.q.points.length) {
      var ev = S.q.events.slice(0, 200), pt = S.q.points.slice(0, 400);
      var r = await api('POST', '/crew/sync', { events: ev, points: pt });
      var gone = {}; (r.kept || []).concat(r.dup || [], r.bad || []).forEach(function(c){ gone[c] = 1; });
      S.q.events = S.q.events.filter(function(e){ return !gone[e.client_id]; });
      S.q.points = S.q.points.slice(pt.length);
      if (pt.length) S.ptSentAt = Date.now();
      saveQ();
    }
    await uploadQueued();
    if (byHand) { toast(pending() ? 'Some things are still waiting' : 'Everything is sent'); refresh(); }
  } catch (e) { if (byHand) toast(e.message); }
  finally { S.syncing = false; paintSync(); if (S.syncAgain) { S.syncAgain = false; setTimeout(syncNow, 50); } }
}
setInterval(function(){ if (S.token && (S.q.events.length || S.q.points.length || S.fileWait)) syncNow(); }, 30000);
window.addEventListener('online', function(){ setOnline(true); });
window.addEventListener('offline', function(){ setOnline(false); });

// ── photos and videos waiting to upload (IndexedDB: a blob does not fit localStorage) ──
function idb(){ return new Promise(function(res, rej){ var r = indexedDB.open('crewq', 1);
  r.onupgradeneeded = function(){ r.result.createObjectStore('files', { keyPath: 'id' }); };
  r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
async function fqDo(mode, fn){ var db = await idb(); return new Promise(function(res, rej){ var tx = db.transaction('files', mode), st = tx.objectStore('files'), q = fn(st);
  tx.oncomplete = function(){ res(q && 'result' in q ? q.result : undefined); }; tx.onerror = function(){ rej(tx.error); }; }); }
var fqAdd = function(o){ return fqDo('readwrite', function(st){ return st.put(o); }); };
var fqAll = function(){ return fqDo('readonly', function(st){ return st.getAll(); }); };
var fqDel = function(id){ return fqDo('readwrite', function(st){ return st.delete(id); }); };
async function fileCount(){ try { S.fileWait = (await fqAll()).length; } catch (e) { S.fileWait = 0; } paintSync(); }
async function uploadQueued(){
  var all = []; try { all = await fqAll(); } catch (e) { return; }
  for (var i = 0; i < all.length; i++) {
    var f = all[i];
    var sg = await api('POST', '/jobs/' + encodeURIComponent(f.jobId) + '/files/sign', { name: f.name, size: f.blob.size, mime: f.mime, kind: 'upload', source: 'site' });
    var put = await fetch(sg.signedUrl, { method: 'PUT', headers: { 'content-type': f.mime, 'x-upsert': 'false' }, body: f.blob });
    if (!put.ok) throw new Error('The photo did not reach storage (' + put.status + ').');
    await api('POST', '/jobs/' + encodeURIComponent(f.jobId) + '/files/' + sg.fileId + '/landed', {});
    await fqDel(f.id);
  }
  await fileCount();
}
// A phone photo is 3–6 MB; on site that is minutes of signal. 2000 px is plenty.
function shrink(file){
  return new Promise(function(res){
    if (!/^image\/(jpeg|png|webp)$/i.test(file.type) || file.size < 900000) return res(file);
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ res(b && b.size < file.size ? b : file); }, 'image/jpeg', 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
async function addFiles(files, rowId, jobId){
  if (!jobId) { toast('This job is not in RoofMap yet, so photos cannot be kept on it.'); return; }
  var n = 0;
  for (var i = 0; i < files.length; i++) {
    var f = files[i], b = await shrink(f);
    var stamp = new Date().toISOString().replace(/[:T]/g, '-').slice(0, 16);
    var name = (/^video\//.test(f.type) ? 'Site video ' : 'Site photo ') + stamp + (b === f ? (f.name.match(/\.[a-z0-9]+$/i) || [''])[0] : '.jpg');
    await fqAdd({ id: uid(), rowId: rowId, jobId: jobId, name: name, mime: (b === f ? f.type : 'image/jpeg') || 'application/octet-stream', blob: b, at: new Date().toISOString() });
    n++;
  }
  await fileCount(); toast(n + (n === 1 ? ' file' : ' files') + (S.online ? ' uploading…' : ' kept — they upload when there is signal'));
  syncNow().then(function(){ if (location.hash.indexOf('#/job/' + rowId) === 0) renderJob(rowId); });
}

// ── location: only 7 am – 7 pm on a booked day ──
function bookedToday(){ var t = nzToday(), w = S.week; if (!w || !w.days) return !!(S.me && S.me._bookedToday && S.me._bookedDate === t);
  var d = w.days.find(function(x){ return x.date === t; }); return d ? !!d.booked : !!(S.me && S.me._bookedToday && S.me._bookedDate === t); }
function inWindow(){ var h = nzParts(new Date()).hour; return h >= GPS_FROM && h < GPS_TO; }
function mayLocate(){ return !!S.token && bookedToday() && inWindow(); }
function distM(a, b){ var R = 6371000, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLn = (b.lng - a.lng) * r;
  var s = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLn / 2) * Math.sin(dLn / 2); return 2 * R * Math.asin(Math.sqrt(s)); }
function onFix(pos){
  if (!mayLocate()) return stopWatch();
  var p = { at: new Date().toISOString(), lat: pos.coords.latitude, lng: pos.coords.longitude,
    acc: Math.round(pos.coords.accuracy || 0), speed: pos.coords.speed == null ? null : pos.coords.speed };
  S.fix = p;
  var lk = S.lastKept;
  if (!lk || Date.parse(p.at) - Date.parse(lk.at) >= KEEP_EVERY_MS || distM(lk, p) >= KEEP_MOVE_M) {
    if (S.status && S.status.kind === 'on') p.row_id = S.status.row_id;
    S.q.points.push(p); if (S.q.points.length > 3000) S.q.points.splice(0, S.q.points.length - 3000);
    S.lastKept = p; saveQ();
    // The first position of a sitting goes at once (the office sees him); after that in fives.
    if (S.online && (S.q.points.length >= 5 || !S.ptSentAt)) syncNow();
  }
  checkNear();
}
function startWatch(){
  if (S.watch != null || !navigator.geolocation) return;
  S.watch = navigator.geolocation.watchPosition(onFix, function(e){ S.locErr = e.message || 'Location is off'; paintToday(); },
    { enableHighAccuracy: true, maximumAge: 30000, timeout: 30000 });
}
function stopWatch(){ if (S.watch != null && navigator.geolocation) navigator.geolocation.clearWatch(S.watch); S.watch = null; }
function trackTick(){ if (mayLocate() && LS.get('crew_loc_ok', false)) startWatch(); else stopWatch(); }
setInterval(trackTick, 60000);
function askLocation(){
  if (!navigator.geolocation) return toast('This phone cannot share its location.');
  if (!mayLocate()) return toast('Location is only used 7 am – 7 pm on days your crew is booked.');
  navigator.geolocation.getCurrentPosition(function(pos){ LS.set('crew_loc_ok', true); onFix(pos); startWatch(); refresh(); },
    function(e){ toast('Location was not allowed — turn it on for this site in your phone’s settings.'); S.locErr = e.message; refresh(); },
    { enableHighAccuracy: true, timeout: 20000 });
}
function posNow(){
  return new Promise(function(res){
    if (!mayLocate() || !navigator.geolocation || !LS.get('crew_loc_ok', false)) return res(null);
    if (S.fix && Date.now() - Date.parse(S.fix.at) < 120000) return res(S.fix);
    navigator.geolocation.getCurrentPosition(function(pos){ onFix(pos); res(S.fix); }, function(){ res(null); }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  });
}
// "You're at 12 Kauri Lane — clock on?"
function checkNear(){
  var el = document.getElementById('near'); if (!el || !S.fix || !S.week) { if (el) el.classList.remove('on'); return; }
  var t = nzToday(), d = (S.week.days || []).find(function(x){ return x.date === t; });
  var hit = null;
  (d ? d.jobs : []).forEach(function(j){ var c = LS.get('crew_row_' + j.row_id, null); if (c && c.site_point && distM(c.site_point, S.fix) < SITE_R) hit = j; });
  if (!hit || (S.status && S.status.kind === 'on' && S.status.row_id === hit.row_id) || LS.get('crew_near_no_' + t + hit.row_id, false)) { el.classList.remove('on'); return; }
  el.innerHTML = '<div style="font-weight:700;margin:0 0 6px">You’re at ' + esc(hit.site || hit.client) + '</div>' +
    '<div class="grid2"><button class="btn g" onclick="clock(\'on\',\'' + esc(hit.row_id) + '\',\'' + esc(hit.job_id) + '\')">Clock on here</button>' +
    '<button class="btn o" onclick="LS.set(\'crew_near_no_' + t + esc(hit.row_id) + '\',true);checkNear()">Not now</button></div>';
  el.classList.add('on');
}

async function record(kind, o){
  o = o || {};
  var e = { client_id: uid(), kind: kind, at: new Date().toISOString(), row_id: o.row_id || '', job_id: o.job_id || '' };
  if (o.data) e.data = o.data;
  if (kind !== 'check' && kind !== 'note') { var p = await posNow(); if (p) { e.lat = p.lat; e.lng = p.lng; e.acc = p.acc; } }
  S.q.events.push(e); saveQ();
  if (kind !== 'check' && kind !== 'note') { S.status = { kind: kind, row_id: e.row_id, at: e.at, date: nzToday() }; LS.set('crew_status', S.status); }
  syncNow();
  return e;
}
async function clock(kind, rowId, jobId){
  // Moving to another job closes the one before it first, so the gap is travel.
  if (kind === 'on' && S.status && S.status.kind === 'on' && S.status.date === nzToday() && S.status.row_id !== rowId) await record('off', { row_id: S.status.row_id });
  await record(kind, { row_id: rowId || '', job_id: jobId || '' });
  toast({ on: 'Clocked on', off: 'Clocked off', travel: 'Travelling', break: 'On a break', end: 'Day finished — good work' }[kind] || 'Kept');
  document.getElementById('near').classList.remove('on');
  refresh();
}
function statusText(){
  var s = S.status; if (!s || s.date !== nzToday()) return 'Not started yet';
  var row = s.row_id && LS.get('crew_row_' + s.row_id, null);
  var where = row ? (row.client || row.site) : '';
  return ({ on: 'On site' + (where ? ' at ' + where : ''), off: 'Clocked off' + (where ? ' ' + where : ''), travel: 'Travelling',
    break: 'On a break', end: 'Day finished' }[s.kind] || s.kind) + ' · since ' + hm(s.at);
}

  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  var ios = /iP(hone|ad|od)/.test(navigator.userAgent);
  main('<div class="card"><div class="big">' + esc((me.user && (me.user.name || me.user.email)) || '') + '</div><div class="mut">' + esc((me.user && me.user.email) || '') + (me.company ? ' · ' + esc(me.company) : '') + '</div>' +
    '<label class="f" for="crewSel">My crew</label><select class="t" id="crewSel" onchange="setCrew(this.value)"><option value="">— pick your crew —</option>' +
    (me.crews || []).map(function(c){ return '<option value="' + esc(c.id) + '"' + (c.id === me.crew_id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select>' +
    '<label class="f" for="myName">Name the office sees</label><input class="t" id="myName" value="' + esc((me.user && me.user.name) || '') + '" onchange="setName(this.value)"></div>' +
    '<div class="card"><h2>Location</h2><p style="margin:0 0 8px">' + esc((me.gps && me.gps.rule) || 'Location is only recorded 7 am – 7 pm on days your crew is booked on the schedule.') + '</p>' +
    '<p class="mut" style="margin:0 0 8px">It works while this app is open. Keep it open on site — “Keep screen on” helps.</p>' + locBanner() +
    '<label class="chk"><input type="checkbox" id="wakeT"' + (LS.get('crew_wake', false) ? ' checked' : '') + ' onchange="setWake(this.checked)"><span>Keep screen on while the app is open</span></label></div>' +
    (standalone ? '' : '<div class="card"><h2>Put it on your home screen</h2>' + (ios ? '<p>In Safari: tap <b>Share</b> (the square with the arrow), then <b>Add to Home Screen</b>.</p>'
      : '<p>In Chrome: tap the <b>⋮</b> menu, then <b>Install app</b> (or <b>Add to Home screen</b>).</p>') + '</div>') +
    '<div class="card"><h2>Sending</h2><p class="mut" style="margin:0 0 8px">' + S.q.events.length + ' presses, ' + S.q.points.length + ' positions and ' + S.fileWait + ' photos waiting.</p>' +
    '<button class="btn o w" onclick="syncNow(true)">Send now</button></div>' +
    '<button class="btn o w" onclick="signOut()">Sign out</button><p class="mut" style="text-align:center">RoofMap Crew · ' + CREW_BUILD + '</p>');
}
async function setCrew(id){ try { await api('PUT', '/crew/me', { crew_id: id }); S.me.crew_id = id; LS.set('crew_me', S.me); toast('Crew saved'); S.week = null; loadThisWeek().catch(function(){}); } catch (e) { toast(e.message); } }
async function setName(n){ try { await api('PUT', '/crew/me', { name: n }); if (S.me && S.me.user) S.me.user.name = n; LS.set('crew_me', S.me); toast('Saved'); } catch (e) { toast(e.message); } }
var _wake = null;
async function setWake(on){ LS.set('crew_wake', !!on); if (on) { try { _wake = await navigator.wakeLock.request('screen'); } catch (e) { toast('This phone won’t keep the screen on from here.'); } } else if (_wake) { try { _wake.release(); } catch (e) {} _wake = null; } }
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') { if (LS.get('crew_wake', false)) setWake(true); trackTick(); if (S.token) { syncNow(); if ((location.hash || '#/today').indexOf('#/today') === 0) renderToday(); } }
});

// ── start ──
(async function boot(){
  if (S.status && S.status.date !== nzToday()) { S.status = null; LS.del('crew_status'); }
  paintSync(); fileCount();
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('/crew-sw.js', { scope: '/crew' }); } catch (e) {} }
  if (!S.token) return renderSignIn();
  route();
  try { await loadMe(); route(); } catch (e) {}
  syncNow();
})();
window.__crew = { S: S, syncNow: syncNow, record: record, clock: clock, mayLocate: mayLocate, onFix: onFix, nzParts: nzParts, fqAll: fqAll };
</script>
