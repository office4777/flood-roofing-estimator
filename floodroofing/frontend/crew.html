<html lang="en-NZ">
<head>
<meta charset="utf-8">

<script>
// FITS THE PHONE, WHATEVER CHROME SAYS (2026-11-13, the owner's screenshots: the app laid out 980 px
// wide, tiny and pinch-zoomed). Chrome's "Desktop site" setting ignores the viewport tag and lays a page
// out at 980 px; on a touch phone whose page is far wider than its screen, the whole app is scaled up to
// fill the screen instead.
(function(){ function fit(){ var de = document.documentElement; de.style.zoom = '';
  var sw = screen.width, cw = de.clientWidth || window.innerWidth, coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  if (coarse && sw && cw > sw * 1.15) de.style.zoom = (cw / sw).toFixed(3); }
  window.__crewFit = fit; fit(); addEventListener('resize', fit); addEventListener('orientationchange', function(){ setTimeout(fit, 250); }); })();
</script>
<title>RoofMap Crew</title>
<meta name="description" content="The crew's day: jobs from the schedule, the job on site, checklists, photos and hours.">
<meta name="theme-color" content="#0a1628">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<meta name="robots" content="noindex">
<link rel="manifest" href="crew.webmanifest">
<link rel="icon" href="brand/pwa-192.png">
<link rel="apple-touch-icon" href="brand/pwa-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RoofMap Crew">
<style>
/* RoofMap's own look (2026-11-13, the owner: "make it look like roofmap ... big buttons like fergus"):
   light ground, navy bar with the cyan rule, white cards under navy bands, line icons, no emoji. */
:root{--navy:#0a1628;--navy2:#10233c;--blue:#0099e0;--cyan:#0099cc;--blue-d:#0077b3;--ink:#0f172a;--mut:#5b6b80;--line:#dde4ee;--bg:#eef3f9;--card:#fff;
  --green:#15a34a;--green-d:#0f7a37;--red:#dc2626;--amber:#b45309;--chip:#e0f2fe;--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--font);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body{min-height:100vh;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-d)}
svg.i{width:1.15em;height:1.15em;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
#top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:3px solid var(--cyan);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;min-height:62px}
#top .mark{width:36px;height:36px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#top .mark img{width:30px;height:30px}
#top .tt{flex:1;min-width:0;line-height:1.15}
#top .tt small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7dd3fc}
#top h1{font-size:19px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .back{background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;border-radius:10px;cursor:pointer;display:none;align-items:center;justify-content:center;flex:0 0 auto}
#top .back svg{width:22px;height:22px}
#sync{font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap;cursor:pointer;border:0;color:#fff}
#sync.off{background:#9a3412}#sync.wait{background:#b45309}
#main{padding:14px 14px calc(env(safe-area-inset-bottom) + 96px);max-width:640px;margin:0 auto}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(10,22,40,.06)}
#nav button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:9px 0 10px;font-size:13px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:68px}
#nav button svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--blue-d);border-top-color:var(--blue);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden;box-shadow:0 1px 2px rgba(10,22,40,.05)}
.card > .bd{padding:14px}
.card > h2,.band{margin:0;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:9px 14px;display:flex;align-items:center;gap:8px}
.card > h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:#bae6fd}
.sec-h{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--navy);margin:20px 2px 10px;display:flex;align-items:center;gap:8px}
.sec-h::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--cyan)}
.big{font-size:23px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em;line-height:1.2}
.mut{color:var(--mut);font-size:15px}
.date{font-size:15px;color:var(--mut);font-weight:600;margin:2px 2px 12px}
.row{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none;min-height:58px;line-height:1.15;text-align:center}
.btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.btn.p{background:var(--blue);color:#fff}.btn.g{background:var(--green);color:#fff}.btn.r{background:var(--red);color:#fff}
.btn.o{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn.n{background:var(--navy);color:#fff}
.btn.w{width:100%}
.btn.xl{min-height:70px;font-size:19px;border-radius:14px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* the big square tiles, Fergus Go's own idea */
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;padding:12px 6px;text-align:center;line-height:1.15}
.tile svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile small{display:block;font-size:12.5px;font-weight:600;opacity:.85;margin-top:-4px}
.tile.on{background:var(--chip);border-color:var(--blue);color:var(--blue-d)}
.tile.p{background:var(--blue);border-color:var(--blue);color:#fff}
.tile.n{background:var(--navy);border-color:var(--navy);color:#fff}
.tile:active{transform:scale(.97)}
.now{display:flex;align-items:center;gap:14px}
.now .dot{width:16px;height:16px;border-radius:50%;background:#94a3b8;flex:0 0 auto;box-shadow:0 0 0 5px rgba(148,163,184,.2)}
.now.on .dot{background:var(--green);box-shadow:0 0 0 5px rgba(21,163,74,.2)}
.now.tr .dot{background:var(--blue);box-shadow:0 0 0 5px rgba(0,153,224,.2)}
.now.br .dot{background:#d97706;box-shadow:0 0 0 5px rgba(217,119,6,.2)}
.status{font-weight:800;font-size:21px;line-height:1.2}
.job{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:8px solid var(--blue);border-radius:14px;padding:16px 14px;margin:0 0 12px;cursor:pointer;color:inherit;min-height:96px;box-shadow:0 1px 2px rgba(10,22,40,.05);font:inherit}
.job .tx{flex:1;min-width:0}
.job .c{font-weight:800;font-size:20px;line-height:1.2}.job .c .ref{color:var(--mut);font-weight:600;font-size:15px}
.job .a{color:var(--mut);font-size:16px;margin-top:3px}
.job .go{width:30px;height:30px;color:#94a3b8;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.job.live{border-color:var(--green);border-left-color:var(--green);background:#f0fdf4}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--blue-d);margin:6px 6px 0 0}
.chip.g{background:#dcfce7;color:#14532d}
.banner{border-radius:12px;padding:13px 14px;margin:0 0 12px;font-size:15.5px;display:flex;gap:11px;align-items:flex-start;border:1px solid transparent;line-height:1.35}
.banner > svg{width:22px;height:22px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.banner .btn{margin-top:10px;min-height:52px}
.banner.ok{background:#dcfce7;color:#14532d;border-color:#bbf7d0}.banner.no{background:#fff;color:#334155;border-color:var(--line)}
.banner.warn{background:#fff7e6;color:#7c2d12;border-color:#fcd9a8}.banner.info{background:#e0f2fe;color:#0c4a6e;border-color:#bae6fd}
.day{margin:0 0 16px}.day h3{font-size:15px;margin:0 0 9px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;font-weight:800}
.day.today h3{color:var(--blue-d)}
.empty{color:var(--mut);font-size:16px;padding:16px;background:#fff;border:1px dashed var(--line);border-radius:12px;text-align:center}
ul.lines{margin:0;padding-left:20px;font-size:16.5px}ul.lines li{margin:5px 0}
.chk{display:flex;gap:14px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px;min-height:56px}
.chk:last-child{border-bottom:0}
.chk input{width:30px;height:30px;flex:0 0 auto;accent-color:var(--green)}
.chk.done span{color:var(--mut);text-decoration:line-through}
.file{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit;min-height:58px;font:inherit}
.file:last-child{border-bottom:0}
.file .ic{width:40px;height:40px;border-radius:10px;background:var(--chip);color:var(--blue-d);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.file .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.file .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.wait-chip{font-size:12px;font-weight:700;background:#fff7e6;color:#7c2d12;padding:3px 8px;border-radius:999px}
label.f{display:block;font-size:14px;font-weight:700;color:var(--navy);margin:12px 0 6px}
input.t,select.t,textarea.t{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:17px;min-height:56px}
input.t:focus,select.t:focus,textarea.t:focus{outline:none;border-color:var(--blue)}
textarea.t{min-height:96px;resize:vertical}
table.h{width:100%;border-collapse:collapse;font-size:16px}
table.h td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.h td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.tot td{font-weight:800;border-bottom:0}
.wk{display:flex;align-items:center;gap:10px;margin:0 0 12px}.wk .lbl{flex:1;text-align:center;font-weight:800;font-size:17px;color:var(--navy)}
.wk .btn{min-width:58px;padding:0}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 14px}
.seg button{flex:1;border:0;background:none;padding:13px;cursor:pointer;font-weight:700;color:var(--mut);min-height:52px}
.seg button.on{background:var(--navy);color:#fff}
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:16px;margin:0 0 14px}
.hero .big{color:#fff}.hero .mut{color:#bcd0e6}
.near{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 82px);z-index:30;background:var(--navy);color:#fff;border-radius:14px;padding:14px;box-shadow:0 10px 28px rgba(10,22,40,.35);border-top:3px solid var(--cyan);display:none}
.near.on{display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 88px);z-index:40;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:15.5px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.signin{max-width:440px;margin:6vh auto 0}
.signin .logo{text-align:center;margin:0 0 20px}
.signin .logo img{width:84px;height:84px;border-radius:20px;background:#fff;padding:8px;box-shadow:0 4px 14px rgba(10,22,40,.12)}
.err{color:var(--red);font-size:15px;margin:8px 0 0;min-height:1em;font-weight:600}
.pre{white-space:pre-wrap;font-size:16.5px}
.photo-in{display:none}
.foot{text-align:center;color:var(--mut);font-size:13px;margin:14px 0}
</style>
</head>
<body>
<header id="top"><button class="back" id="backBtn" aria-label="Back" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><span class="mark" id="topMark"><img src="brand/roofmap_icon.png" alt=""></span><div class="tt"><small>RoofMap Crew</small><h1 id="title">Today</h1></div><button id="sync" onclick="syncNow(true)">…</button></header>
<main id="main"></main>
<nav id="nav" hidden>
  <button data-v="today" onclick="go('#/today')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-v="week" onclick="go('#/week')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h2M14 14h2M8 18h2"/></svg>Week</button>
  <button data-v="hours" onclick="go('#/hours')"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Hours</button>
  <button data-v="me" onclick="go('#/me')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
</nav>
<div class="near" id="near"></div>
<div id="toast"></div>
<input type="file" id="camIn" class="photo-in" accept="image/*,video/*" capture="environment">
<input type="file" id="pickIn" class="photo-in" accept="image/*,video/*" multiple>
<script>
'use strict';
// THE CREW APP (2026-11-13). The phone is the truth while there is no signal:
// every press is kept on the phone at once and sent when it can be. Location
// is only asked for, and only kept, 7 am – 7 pm on a day the crew is booked
// on the schedule board (the server refuses it outside that whatever is sent).
var CREW_BUILD = '2026-11-13b';
var API = window.CREW_API || 'https://flood-roofing-estimator-production.up.railway.app';
var NZ = 'Pacific/Auckland';
var GPS_FROM = 7, GPS_TO = 19, SITE_R = 200, KEEP_EVERY_MS = 60000, KEEP_MOVE_M = 40;

var LS = {
  get: function(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del: function(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
var S = {
  token: (function(){ try { return localStorage.getItem('crew_token') || ''; } catch (e) { return ''; } })(),
  me: LS.get('crew_me', null),
  online: navigator.onLine !== false,
  q: LS.get('crew_q', { events: [], points: [] }),
  status: LS.get('crew_status', null),       // {kind, row_id, at, date}
  week: LS.get('crew_week', null),
  weekFrom: null, weekAll: false,
  fix: null, watch: null, lastKept: null, fileWait: 0, syncing: false
};
function saveQ(){ LS.set('crew_q', S.q); paintSync(); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
// Line icons, RoofMap's own (the app has no emoji anywhere the crew presses).
var ICON = {
  truck: '<path d="M1 7h13v10H1zM14 10h4l3 3v4h-7z"/><circle cx="5.5" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/>',
  cup: '<path d="M3 8h14v5a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5zM17 9h1.5a2.5 2.5 0 0 1 0 5H17M7 2v3M11 2v3"/>',
  flag: '<path d="M4 22V3M4 4h12l-2 4 2 4H4"/>',
  pin: '<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
  nav: '<path d="M3 11l18-8-8 18-2-8z"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  cam: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  img: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  video: '<rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4z"/>',
  doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
  play: '<circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/>',
  stop: '<circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="6" height="6"/>',
  chev: '<path d="M9 18l6-6-6-6"/>',
  left: '<path d="M15 18l-6-6 6-6"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  wait: '<path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.2 16.2l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.2 7.8l2.8-2.8"/>',
  send: '<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  note: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'
};
function I(n, cls){ return '<svg class="' + (cls || 'i') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICON[n] || '') + '</svg>'; }
function uid(){ try { return crypto.randomUUID(); } catch (e) { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2); } }
function toast(t){ var el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ el.classList.remove('on'); }, 2600); }

// ── NZ time ──
function nzParts(d){
  var p = {}; new Intl.DateTimeFormat('en-NZ', { timeZone: NZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(d || new Date()).forEach(function(x){ p[x.type] = x.value; });

// ── the server ──
async function api(method, path, body){
  var opts = { method: method, headers: { Authorization: 'Bearer ' + S.token } };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  var r;
  try { r = await fetch(API + path, opts); }
  catch (e) { setOnline(false); var ne = new Error('No signal — kept on your phone.'); ne.offline = true; throw ne; }
  setOnline(true);
  var j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status === 401) { signOut(true); var ae = new Error('Please sign in again.'); ae.status = 401; throw ae; }
  if (!r.ok) { var er = new Error(j.error || ('The server answered ' + r.status)); er.status = r.status; er.code = j.code; throw er; }
  return j;
}
function setOnline(v){ if (S.online !== v) { S.online = v; paintSync(); if (v) setTimeout(function(){ syncNow(); }, 50); } }

// ── what is waiting to send ──
function pending(){ return S.q.events.length + (S.q.points.length ? 1 : 0) + S.fileWait; }
function paintSync(){
  var el = document.getElementById('sync'); if (!el) return;
  var n = S.q.events.length + S.fileWait;
  el.className = !S.online ? 'off' : (n ? 'wait' : '');
  el.textContent = !S.online ? (n ? 'No signal · ' + n + ' waiting' : 'No signal') : (n ? n + ' to send…' : (S.syncing ? 'Sending…' : '✓ Up to date'));
}
async function syncNow(byHand){
  if (!S.token) return;
  if (S.syncing) { S.syncAgain = true; return; }
  S.syncing = true; paintSync();
  try {
    if (S.q.events.length || S.q.points.length) {
      var ev = S.q.events.slice(0, 200), pt = S.q.points.slice(0, 400);
      var r = await api('POST', '/crew/sync', { events: ev, points: pt });
      var gone = {}; (r.kept || []).concat(r.dup || [], r.bad || []).forEach(function(c){ gone[c] = 1; });
      S.q.events = S.q.events.filter(function(e){ return !gone[e.client_id]; });
      S.q.points = S.q.points.slice(pt.length);
      if (pt.length) S.ptSentAt = Date.now();
      saveQ();
    }
    await uploadQueued();
    if (byHand) { toast(pending() ? 'Some things are still waiting' : 'Everything is sent'); refresh(); }
  } catch (e) { if (byHand) toast(e.message); }
  finally { S.syncing = false; paintSync(); if (S.syncAgain) { S.syncAgain = false; setTimeout(syncNow, 50); } }
}
setInterval(function(){ if (S.token && (S.q.events.length || S.q.points.length || S.fileWait)) syncNow(); }, 30000);
window.addEventListener('online', function(){ setOnline(true); });
window.addEventListener('offline', function(){ setOnline(false); });

// ── photos and videos waiting to upload (IndexedDB: a blob does not fit localStorage) ──
function idb(){ return new Promise(function(res, rej){ var r = indexedDB.open('crewq', 1);
  r.onupgradeneeded = function(){ r.result.createObjectStore('files', { keyPath: 'id' }); };
  r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }

async function uploadQueued(){
  var all = []; try { all = await fqAll(); } catch (e) { return; }
  for (var i = 0; i < all.length; i++) {
    var f = all[i];
    var sg = await api('POST', '/jobs/' + encodeURIComponent(f.jobId) + '/files/sign', { name: f.name, size: f.blob.size, mime: f.mime, kind: 'upload', source: 'site' });
    var put = await fetch(sg.signedUrl, { method: 'PUT', headers: { 'content-type': f.mime, 'x-upsert': 'false' }, body: f.blob });
    if (!put.ok) throw new Error('The photo did not reach storage (' + put.status + ').');
    await api('POST', '/jobs/' + encodeURIComponent(f.jobId) + '/files/' + sg.fileId + '/landed', {});
    await fqDel(f.id);

}
// A phone photo is 3–6 MB; on site that is minutes of signal. 2000 px is plenty.

  return new Promise(function(res){

    img.onload = function(){

      var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);

}
async function addFiles(files, rowId, jobId){
  if (!jobId) { toast('This job is not in RoofMap yet, so photos cannot be kept on it.'); return; }
  var n = 0;
  for (var i = 0; i < files.length; i++) {
    var f = files[i], b = await shrink(f);
    var stamp = new Date().toISOString().replace(/[:T]/g, '-').slice(0, 16);
    var name = (/^video\//.test(f.type) ? 'Site video ' : 'Site photo ') + stamp + (b === f ? (f.name.match(/\.[a-z0-9]+$/i) || [''])[0] : '.jpg');
    await fqAdd({ id: uid(), rowId: rowId, jobId: jobId, name: name, mime: (b === f ? f.type : 'image/jpeg') || 'application/octet-stream', blob: b, at: new Date().toISOString() });
    n++;
  }
  await fileCount(); toast(n + (n === 1 ? ' file' : ' files') + (S.online ? ' uploading…' : ' kept — they upload when there is signal'));
  syncNow().then(function(){ if (location.hash.indexOf('#/job/' + rowId) === 0) renderJob(rowId); });
}

// ── location: only 7 am – 7 pm on a booked day ──
function bookedToday(){ var t = nzToday(), w = S.week; if (!w || !w.days) return !!(S.me && S.me._bookedToday && S.me._bookedDate === t);
  var d = w.days.find(function(x){ return x.date === t; }); return d ? !!d.booked : !!(S.me && S.me._bookedToday && S.me._bookedDate === t); }

  S.fix = p;

    if (S.status && S.status.kind === 'on') p.row_id = S.status.row_id;

    S.lastKept = p; saveQ();

function startWatch(){

    { enableHighAccuracy: true, maximumAge: 30000, timeout: 30000 });
}
function stopWatch(){ if (S.watch != null && navigator.geolocation) navigator.geolocation.clearWatch(S.watch); S.watch = null; }

setInterval(trackTick, 60000);
function askLocation(){
  if (!navigator.geolocation) return toast('This phone cannot share its location.');
  if (!mayLocate()) return toast('Location is only used 7 am – 7 pm on days your crew is booked.');
  navigator.geolocation.getCurrentPosition(function(pos){ LS.set('crew_loc_ok', true); onFix(pos); startWatch(); refresh(); },
    function(e){ toast('Location was not allowed — turn it on for this site in your phone’s settings.'); S.locErr = e.message; refresh(); },
    { enableHighAccuracy: true, timeout: 20000 });
}
function posNow(){
  return new Promise(function(res){
    if (!mayLocate() || !navigator.geolocation || !LS.get('crew_loc_ok', false)) return res(null);

// "You're at 12 Kauri Lane — clock on?"
function checkNear(){
  var el = document.getElementById('near'); if (!el || !S.fix || !S.week) { if (el) el.classList.remove('on'); return; }
  var t = nzToday(), d = (S.week.days || []).find(function(x){ return x.date === t; });
  var hit = null;
  (d ? d.jobs : []).forEach(function(j){ var c = LS.get('crew_row_' + j.row_id, null); if (c && c.site_point && distM(c.site_point, S.fix) < SITE_R) hit = j; });
  if (!hit || (S.status && S.status.kind === 'on' && S.status.row_id === hit.row_id) || LS.get('crew_near_no_' + t + hit.row_id, false)) { el.classList.remove('on'); return; }
  el.innerHTML = '<div style="font-weight:700;margin:0 0 6px">You’re at ' + esc(hit.site || hit.client) + '</div>' +
    '<div class="grid2"><button class="btn g" onclick="clock(\'on\',\'' + esc(hit.row_id) + '\',\'' + esc(hit.job_id) + '\')">' + I('play') + ' Clock on here</button>' +
    '<button class="btn o" onclick="LS.set(\'crew_near_no_' + t + esc(hit.row_id) + '\',true);checkNear()">Not now</button></div>';

// ── clock on / off, travel, break, finish ──
async function record(kind, o){
  o = o || {};

  if (o.data) e.data = o.data;
  if (kind !== 'check' && kind !== 'note') { var p = await posNow(); if (p) { e.lat = p.lat; e.lng = p.lng; e.acc = p.acc; } }
  S.q.events.push(e); saveQ();

  syncNow();
  return e;
}
async function clock(kind, rowId, jobId){

}
function statusText(){
  var s = S.status; if (!s || s.date !== nzToday()) return 'Not started yet';
  var row = s.row_id && LS.get('crew_row_' + s.row_id, null);
  var where = row ? (row.client || row.site) : '';
  return ({ on: 'On site' + (where ? ' at ' + where : ''), off: 'Clocked off' + (where ? ' ' + where : ''), travel: 'Travelling',
    break: 'On a break', end: 'Day finished' }[s.kind] || s.kind) + ' · since ' + hm(s.at);

// ── screens ──
function go(h){ if (location.hash === h) route(); else location.hash = h; }
function setTop(title, back){ document.getElementById('title').textContent = title; document.getElementById('backBtn').style.display = back ? 'flex' : 'none';
  document.getElementById('topMark').style.display = back ? 'none' : 'flex';

function paintToday(){ if ((location.hash || '#/today').indexOf('#/today') === 0) renderToday(true); }

    var t = nzToday();
    var days = (w && w.days || []).filter(function(d){ return !d.weekend || d.jobs.length; });
    main('<div class="wk"><button class="btn o" aria-label="Last week" onclick="weekStep(-7)">' + I('left') + '</button><div class="lbl">' + esc(dayName(S.weekFrom)) + ' – ' + esc(dayName(addDays(S.weekFrom, 6))) + '</div><button class="btn o" aria-label="Next week" onclick="weekStep(7)">' + I('chev') + '</button></div>' +
      '<div class="seg"><button class="' + (S.weekAll ? '' : 'on') + '" onclick="S.weekAll=false;renderWeek()">My crew</button><button class="' + (S.weekAll ? 'on' : '') + '" onclick="S.weekAll=true;renderWeek()">Every crew</button></div>' +
      (w && w._stale ? '<div class="banner info">' + I('info') + '<div>Offline copy — it updates when there is signal.</div></div>' : '') +
      (!w ? '<div class="empty">Loading…</div>' : days.map(function(d){
        return '<div class="day' + (d.date === t ? ' today' : '') + '"><h3><span>' + esc(dayName(d.date, true)) + (d.date === t ? ' · today' : '') + '</span>' +
          '<span>' + (d.nonwork && !d.weekend ? '<span class="chip">Holiday</span>' : (d.booked ? '<span class="chip g" style="margin:0">Booked</span>' : '')) + '</span></h3>' +
          (d.jobs.length ? d.jobs.map(jobCardHtml).join('') : '<div class="empty">Nothing booked.</div>') + '</div>';
      }).join(''))); };
  draw(LS.get('crew_wk_' + S.weekFrom + (S.weekAll ? '_all' : ''), null));
  try { draw(await loadWeek(S.weekFrom, S.weekAll)); } catch (e) { if (!LS.get('crew_wk_' + S.weekFrom + (S.weekAll ? '_all' : ''), null)) main('<div class="banner warn">' + I('info') + '<div>' + esc(e.message) + '</div></div>'); }
}
function weekStep(n){ S.weekFrom = addDays(S.weekFrom || mondayOf(nzToday()), n); renderWeek(); }

var _JOB = {};
async function renderJob(id){
  setTop('Job', true);
  var draw = async function(r){
    if (!r) return main('<div class="empty">Loading…</div>');
    _JOB = r;
    setTop(r.client || 'Job', true);
    var waiting = []; try { waiting = (await fqAll()).filter(function(f){ return f.rowId === id; }); } catch (e) {}
    var on = S.status && S.status.kind === 'on' && S.status.row_id === id && S.status.date === nzToday();
    var phone = String(r.phone || '').replace(/[^\d+]/g, '');
    var gmaps = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(r.site || '');
    var amaps = 'https://maps.apple.com/?daddr=' + encodeURIComponent(r.site || '');
    var ios = /iP(hone|ad|od)/.test(navigator.userAgent);
    var packs = (r.files || []).filter(function(f){ return /job ?pack|roof ?map|sheet layout|cut list/i.test(f.name); });
    var media = (r.files || []).filter(function(f){ return packs.indexOf(f) < 0 && /^(image|video)\//.test(f.mime || ''); });
    var docs = (r.files || []).filter(function(f){ return packs.indexOf(f) < 0 && media.indexOf(f) < 0; });
    var lists = (S.me && S.me.checklists) || [];
    var localChecks = LS.get('crew_chk_' + id, {});
    var checks = Object.assign({}, r.checks || {}, localChecks);
    var fileRow = function(f){ var ic = /^image/.test(f.mime) ? 'img' : (/^video/.test(f.mime) ? 'video' : 'doc');
      return '<button class="file" onclick="openFile(\'' + esc(r.job_id) + '\',\'' + esc(f.id) + '\')"><span class="ic">' + I(ic) + '</span><span class="n">' + esc(f.name) + '</span><span class="mut">' + esc(new Date(f.at).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' })) + '</span></button>'; };
    var sec = function(title, body, right){ return '<div class="card"><h2>' + title + (right ? '<span class="r">' + right + '</span>' : '') + '</h2><div class="bd">' + body + '</div></div>'; };
    var lineList = function(a){ return '<ul class="lines">' + a.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'; };
    var tiles = [];
    tiles.push('<a class="tile p" href="' + esc(gmaps) + '" target="_blank" rel="noopener">' + I('nav') + 'Directions<small>Google Maps</small></a>');
    if (ios) tiles.push('<a class="tile" href="' + esc(amaps) + '" target="_blank" rel="noopener">' + I('pin') + 'Apple Maps</a>');
    if (phone) { tiles.push('<a class="tile" href="tel:' + esc(phone) + '">' + I('phone') + 'Call</a>'); tiles.push('<a class="tile" href="sms:' + esc(phone) + '">' + I('msg') + 'Text</a>'); }
    var html = (r._stale ? '<div class="banner info">' + I('info') + '<div>Offline copy — it updates when there is signal.</div></div>' : '') +
      '<div class="hero"><div class="big">' + esc(r.client || 'Job') + '</div>' + (r.job_ref ? '<div class="mut">Job ' + esc(r.job_ref) + '</div>' : '') +
      '<div style="margin-top:8px;font-size:17px;display:flex;gap:8px">' + I('pin') + '<span>' + esc(r.site || '') + '</span></div>' +
      (phone ? '<div style="margin-top:6px;font-size:16px;display:flex;gap:8px;color:#bcd0e6">' + I('phone') + '<span>' + esc(r.phone) + '</span></div>' : '') + '</div>' +
      '<div class="' + (tiles.length === 1 ? '' : (tiles.length === 2 ? 'grid2' : (tiles.length === 4 ? 'grid2' : 'grid3'))) + '" style="margin:0 0 12px">' + tiles.join('') + '</div>' +
      (phone ? '' : '<div class="mut" style="margin:-4px 2px 12px">No phone number on the job.</div>') +
      (on ? '<button class="btn r w xl" style="margin:0 0 16px" onclick="clock(\'off\',\'' + esc(id) + '\',\'' + esc(r.job_id) + '\')">' + I('stop') + ' Clock off this job</button>'
        : '<button class="btn g w xl" style="margin:0 0 16px" onclick="clock(\'on\',\'' + esc(id) + '\',\'' + esc(r.job_id) + '\')">' + I('play') + ' Clock on at this job</button>') +
      (r.notes ? sec(I('info') + 'From the office', '<div class="pre">' + esc(r.notes) + '</div>') : '') +
      (r.choices && r.choices.length ? sec(I('check') + 'What the customer chose', lineList(r.choices)) : '') +
      (r.scope && r.scope.length ? sec(I('doc') + 'Scope of work', lineList(r.scope)) : (r.description ? sec(I('doc') + 'Scope of work', '<div class="pre">' + esc(r.description) + '</div>') : '')) +
      (r.exclusions && r.exclusions.length ? sec('Not included', lineList(r.exclusions)) : '') +
      (r.quoteNotes && r.quoteNotes.length ? sec('Please note', lineList(r.quoteNotes)) : '') +
      lists.map(function(l){
        var day = l.when === 'daily' ? nzToday() : '';
        var done = 0;
        var items = l.items.map(function(it, i){ var k = l.id + ':' + i + (day ? ':' + day : ''); var c = checks[k] && checks[k].done; if (c) done++;
          return '<label class="chk' + (c ? ' done' : '') + '"><input type="checkbox"' + (c ? ' checked' : '') + ' onchange="tick(\'' + esc(id) + '\',\'' + esc(l.id) + '\',' + i + ',\'' + day + '\',this.checked)"><span>' + esc(it) + '</span></label>'; }).join('');
        return sec(I('check') + esc(l.name), items, done + ' / ' + l.items.length + (l.when === 'daily' ? ' today' : ''));
      }).join('') +
      sec(I('doc') + 'Job pack &amp; roof map', packs.length ? packs.map(fileRow).join('') : '<div class="mut">The office hasn’t kept a job pack on this job yet.</div>') +
      sec(I('cam') + 'Photos &amp; videos', '<div class="grid2" style="margin-bottom:8px"><button class="tile p" onclick="pickPhoto(true)">' + I('cam') + 'Take photo / video</button><button class="tile" onclick="pickPhoto(false)">' + I('img') + 'From phone</button></div>' +
        waiting.map(function(f){ return '<div class="file"><span class="ic">' + I('wait') + '</span><span class="n">' + esc(f.name) + '</span><span class="wait-chip">waiting to upload</span></div>'; }).join('') +
        (media.length ? media.map(fileRow).join('') : (waiting.length ? '' : '<div class="mut">No photos yet.</div>'))) +
      (docs.length ? sec(I('doc') + 'Files', docs.map(fileRow).join('')) : '') +
      sec(I('note') + 'Notes from site', '<textarea class="t" id="noteTx" placeholder="Something the office should know…"></textarea><button class="btn n w" style="margin-top:10px" onclick="addNote(\'' + esc(id) + '\')">' + I('send') + ' Add note</button>' +
        ((r.notesFromCrew || []).length ? '<div style="margin-top:12px">' + r.notesFromCrew.map(function(n){ return '<div style="padding:10px 0;border-top:1px solid var(--line)"><div class="mut">' + esc(dayName(nzParts(new Date(n.at)).date)) + ' ' + esc(hm(n.at)) + '</div><div class="pre">' + esc(n.text) + '</div></div>'; }).join('') + '</div>' : '')) +
      (r.days && r.days.length ? sec(I('clock') + 'Booked days', r.days.map(function(d){ return '<span class="chip">' + esc(dayName(d)) + '</span>'; }).join(' ')) : '');
    main(html);
  };
  var cached = LS.get('crew_row_' + id, null);
  await draw(cached);
  try { var r = await loadRow(id); if (location.hash.indexOf('#/job/' + encodeURIComponent(id)) === 0 || location.hash.indexOf('#/job/' + id) === 0) await draw(r); }
  catch (e) { if (!cached) main('<div class="banner warn">' + I('info') + '<div>' + esc(e.offline ? 'No signal, and this job hasn’t been opened on this phone before.' : e.message) + '</div></div>'); }
}
function pickPhoto(cam){ var el = document.getElementById(cam ? 'camIn' : 'pickIn'); el.value = ''; el.click(); }
['camIn', 'pickIn'].forEach(function(id){ document.getElementById(id).addEventListener('change', function(){
  var fs = Array.prototype.slice.call(this.files || []); if (fs.length) addFiles(fs, _JOB.row_id, _JOB.job_id); }); });
async function openFile(jobId, fid){
  if (!S.online) return toast('Opening a file needs signal.');
  var w = window.open('', '_blank');
  try { var r = await api('GET', '/jobs/' + encodeURIComponent(jobId) + '/files/' + encodeURIComponent(fid) + '/url');
    if (w) w.location = r.url; else location.href = r.url; }
  catch (e) { if (w) w.close(); toast(e.message); }
}
async function tick(rowId, list, item, day, done){
  var k = list + ':' + item + (day ? ':' + day : '');
  var lc = LS.get('crew_chk_' + rowId, {}); lc[k] = { done: done, at: new Date().toISOString() }; LS.set('crew_chk_' + rowId, lc);
  await record('check', { row_id: rowId, job_id: _JOB.job_id || '', data: { list: list, item: item, done: done, day: day } });
  renderJob(rowId);
}
async function addNote(rowId){
  var t = (document.getElementById('noteTx') || {}).value || ''; t = t.trim(); if (!t) return;
  await record('note', { row_id: rowId, job_id: _JOB.job_id || '', data: { text: t } });
  var c = LS.get('crew_row_' + rowId, null);
  if (c) { c.notesFromCrew = [{ at: new Date().toISOString(), text: t }].concat(c.notesFromCrew || []); LS.set('crew_row_' + rowId, c); }
  toast('Note kept'); renderJob(rowId);
}

async function renderHours(){
  setTop('Hours');
  if (!S.hoursFrom) S.hoursFrom = mondayOf(nzToday());
  var key = 'crew_hrs_' + S.hoursFrom;
  var draw = function(h){
    var days = (h && h.days) || [], rows = (h && h.rows) || {};
    var tot = days.reduce(function(a, d){ a.on += d.onsiteTotal; a.tr += d.travel; return a; }, { on: 0, tr: 0 });
    main('<div class="wk"><button class="btn o" aria-label="Last week" onclick="hoursStep(-7)">' + I('left') + '</button><div class="lbl">' + esc(dayName(S.hoursFrom)) + ' – ' + esc(dayName(addDays(S.hoursFrom, 6))) + '</div><button class="btn o" aria-label="Next week" onclick="hoursStep(7)">' + I('chev') + '</button></div>' +
      (S.q.events.length ? '<div class="banner warn">' + I('wait') + '<div>' + S.q.events.length + ' clock presses are still on this phone — the hours update once they’re sent.</div></div>' : '') +
      '<div class="hero"><div class="mut" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12.5px">This week</div><div class="big" style="font-size:34px;margin:4px 0 8px">' + hrs(tot.on + tot.tr) + '</div>' +
      '<div class="grid2"><div><div class="mut">On site</div><div style="font-weight:800;font-size:19px">' + hrs(tot.on) + '</div></div><div><div class="mut">Travel</div><div style="font-weight:800;font-size:19px">' + hrs(tot.tr) + '</div></div></div></div>' +
      (days.length ? days.map(function(d){
        return '<div class="card"><h2>' + esc(dayName(d.date, true)) + (d.open ? '<span class="r" style="color:#fcd34d">left clocked on</span>' : '') + '</h2><div class="bd"><table class="h">' +
          Object.keys(d.onsite).map(function(k){ var r = rows[k] || {}; return '<tr><td><b>' + esc(r.client || r.site || 'Job') + '</b><div class="mut">' + esc(r.site || '') + '</div></td><td class="n">' + hrs(d.onsite[k]) + '</td></tr>'; }).join('') +
          '<tr><td>Travel</td><td class="n">' + hrs(d.travel) + '</td></tr><tr class="tot"><td>Day total · ' + esc(hm(d.first)) + ' – ' + esc(hm(d.last)) + '</td><td class="n">' + hrs(d.total) + '</td></tr></table></div></div>';
      }).join('') : '<div class="empty">No hours this week yet.</div>'));
  };
  draw(LS.get(key, null));
  try { var h = await api('GET', '/crew/hours?from=' + S.hoursFrom + '&to=' + addDays(S.hoursFrom, 6)); LS.set(key, h); if (location.hash.indexOf('#/hours') === 0) draw(h); } catch (e) {}
}
function hoursStep(n){ S.hoursFrom = addDays(S.hoursFrom || mondayOf(nzToday()), n); renderHours(); }

async function renderMe(){
  setTop('Me');
  var me = S.me || {};
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  var ios = /iP(hone|ad|od)/.test(navigator.userAgent);
  main('<div class="hero"><div class="big">' + esc((me.user && (me.user.name || me.user.email)) || '') + '</div><div class="mut">' + esc((me.user && me.user.email) || '') + (me.company ? ' · ' + esc(me.company) : '') + '</div></div>' +
    '<div class="card"><h2>' + I('users') + 'My crew</h2><div class="bd"><label class="f" for="crewSel">Which crew am I on?</label><select class="t" id="crewSel" onchange="setCrew(this.value)"><option value="">— pick your crew —</option>' +
    (me.crews || []).map(function(c){ return '<option value="' + esc(c.id) + '"' + (c.id === me.crew_id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select>' +
    '<label class="f" for="myName">Name the office sees</label><input class="t" id="myName" value="' + esc((me.user && me.user.name) || '') + '" onchange="setName(this.value)"></div></div>' +
    '<div class="card"><h2>' + I('pin') + 'Location</h2><div class="bd"><p style="margin:0 0 8px">' + esc((me.gps && me.gps.rule) || 'Location is only recorded 7 am – 7 pm on days your crew is booked on the schedule.') + '</p>' +
    '<p class="mut" style="margin:0 0 10px">It works while this app is open. Keep it open on site — “Keep screen on” helps.</p>' + locBanner() +
    '<label class="chk"><input type="checkbox" id="wakeT"' + (LS.get('crew_wake', false) ? ' checked' : '') + ' onchange="setWake(this.checked)"><span>Keep screen on while the app is open</span></label></div></div>' +
    (standalone ? '' : '<div class="card"><h2>' + I('img') + 'Put it on your home screen</h2><div class="bd">' + (ios ? '<p style="margin:0">In Safari: tap <b>Share</b> (the square with the arrow), then <b>Add to Home Screen</b>.</p>'
      : '<p style="margin:0">In Chrome: tap the <b>⋮</b> menu, then <b>Install app</b> (or <b>Add to Home screen</b>). If the app looks tiny, untick <b>Desktop site</b> in that menu.</p>') + '</div></div>') +
    '<div class="card"><h2>' + I('send') + 'Sending</h2><div class="bd"><p class="mut" style="margin:0 0 10px">' + S.q.events.length + ' presses, ' + S.q.points.length + ' positions and ' + S.fileWait + ' photos waiting.</p>' +
    '<button class="btn n w" onclick="syncNow(true)">' + I('send') + ' Send now</button></div></div>' +
    '<button class="btn o w" onclick="signOut()">' + I('out') + ' Sign out</button><p class="foot">RoofMap Crew · ' + CREW_BUILD + '</p>');
}
async function setCrew(id){ try { await api('PUT', '/crew/me', { crew_id: id }); S.me.crew_id = id; LS.set('crew_me', S.me); toast('Crew saved'); S.week = null; loadThisWeek().catch(function(){}); } catch (e) { toast(e.message); } }
async function setName(n){ try { await api('PUT', '/crew/me', { name: n }); if (S.me && S.me.user) S.me.user.name = n; LS.set('crew_me', S.me); toast('Saved'); } catch (e) { toast(e.message); } }
var _wake = null;
async function setWake(on){ LS.set('crew_wake', !!on); if (on) { try { _wake = await navigator.wakeLock.request('screen'); } catch (e) { toast('This phone won’t keep the screen on from here.'); } } else if (_wake) { try { _wake.release(); } catch (e) {} _wake = null; } }
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') { if (LS.get('crew_wake', false)) setWake(true); trackTick(); if (S.token) { syncNow(); if ((location.hash || '#/today').indexOf('#/today') === 0) renderToday(); } }
});

// ── start ──
(async function boot(){
  if (S.status && S.status.date !== nzToday()) { S.status = null; LS.del('crew_status'); }
  paintSync(); fileCount();
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('/crew-sw.js', { scope: '/crew' }); } catch (e) {} }
  if (!S.token) return renderSignIn();
  route();
  try { await loadMe(); route(); } catch (e) {}
  syncNow();
})();
window.__crew = { S: S, syncNow: syncNow, record: record, clock: clock, mayLocate: mayLocate, onFix: onFix, nzParts: nzParts, fqAll: fqAll };
</script>
</body>
